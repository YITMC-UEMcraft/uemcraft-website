<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#213d87">
  <title>发展历程 — UEMCraft</title>
  <link rel="icon" href="../favicon.ico" type="images/x-icon">
  <script>
    (function(){
      var t = localStorage.getItem('uemcraft-theme');
      if(!t) t = window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.colorScheme = t;
      var tex = localStorage.getItem('uemcraft-texture');
      if(tex && tex !== 'none'){
        document.documentElement.setAttribute('data-texture', tex);
        var s = document.createElement('style');
        s.id = 'texture-style';
        s.textContent = 'body::after{background-image:url(/assets/img/background_textures/'+tex+'.png);}';
        document.head.appendChild(s);
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/tokens.css?v=8b1853c">
  <link rel="stylesheet" href="/css/base.css?v=8b1853c">
  <link rel="stylesheet" href="/css/layout.css?v=8b1853c">
  <link rel="stylesheet" href="/css/components.css?v=8b1853c">
  <link rel="stylesheet" href="/css/pages.css?v=8b1853c">
  <link rel="stylesheet" href="css/admin.css?v=8b1853c">
</head>
<body>
<script src="/js/components-admin.js?v=8b1853c"></script>

<a href="#main" class="skip-link">跳转到主内容</a>

<main id="main">

<div class="admin-page-header">
  <h1>发展历程</h1>
  <p class="hero-sub">管理关于页「发展历程」时间轴</p>
  <nav class="breadcrumb" aria-label="面包屑">
    <a href="/index.html">首页</a> <span>/</span> <a href="index.html">管理后台</a> <span>/</span> <span>发展历程</span>
  </nav>
</div>

<section class="section">
  <div class="container">

    <div class="admin-toolbar">
      <div class="admin-toolbar-right" style="margin-left:auto;">
        <span class="text-muted">共 <strong id="timelineTotal">0</strong> 条</span>
        <button type="button" class="btn btn-primary btn-sm" id="addTimelineBtn">+ 新增节点</button>
      </div>
    </div>

    <form id="timelineForm" class="admin-card" style="display:none; margin-bottom:var(--space-lg);">
      <div class="form-group">
        <label for="timelineDate">日期文字</label>
        <input id="timelineDate" class="form-input" maxlength="50" placeholder="如：2024-09-16 或 未来……">
      </div>
      <div class="form-group">
        <label for="timelineTitle">标题</label>
        <input id="timelineTitle" class="form-input" maxlength="200" placeholder="如：加入 MUA">
      </div>
      <div class="form-group">
        <label for="timelineDesc">描述</label>
        <textarea id="timelineDesc" class="form-textarea" rows="3" maxlength="500" placeholder="这一节点发生了什么…"></textarea>
      </div>
      <div class="form-group">
        <label for="timelineSort">排序（小的在前）</label>
        <input id="timelineSort" type="number" class="form-input" value="0">
      </div>
      <div style="display:flex;gap:var(--space-sm);align-items:center;flex-wrap:wrap;">
        <button type="submit" class="btn btn-primary" id="timelineSaveBtn">新增</button>
        <button type="button" class="btn btn-ghost" id="timelineCancelBtn">取消</button>
        <span id="timelineMessage" class="wall-form-message" role="status" aria-live="polite"></span>
      </div>
    </form>

    <div id="timelineList" class="admin-list"></div>
    <div id="timelineStatus" class="wall-loading">正在加载…</div>
  </div>
</section>

</main>

<script src="/js/components-footer.js?v=8b1853c"></script>
<script defer src="/js/utils.js?v=8b1853c"></script>
<script defer src="/js/cjk-spacing.js?v=8b1853c"></script>
<script defer src="/js/nav.js?v=8b1853c"></script>
<script defer src="/js/page-transition.js?v=8b1853c"></script>
<script defer src="/js/theme.js?v=8b1853c"></script>
<script defer src="/js/admin-auth.js?v=8b1853c"></script>
<script defer src="/js/admin-timeline.js?v=8b1853c"></script>
</body>
</html>
